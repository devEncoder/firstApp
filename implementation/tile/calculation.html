<!DOCTYPE html>
<html lang="en">

<head>
    <title>Anyboard</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="../style/root.css">
    <link rel="stylesheet" type="text/css" href="../style/calculation.css">
    <link rel="icon" href="../../static/astro.png">
    <script type="text/javascript" src="../script/calculation.js"></script>
</head>

<body>
    <div class="rootbox">
        <img src="../../static/calculator.png" class="astro">
        <h1> calculator</h1>
        <form>
            <p> Amount </p>
            <input type="text" id="borrowedCapital" placeholder="enter value" />
            <p> Annual Rate</p>
            <input type="text" id="annualRate" placeholder="enter rate" />
            <p> Month Duration </p>
            <input type="text" id="MonthDuration" placeholder="enter duration" />
        </form>
        <button class="bouton" onclick="getCalculationValue()">Click for Monthly</button>
        <hr>
        <div class="result">
            <div class="data" id="output"></div>
            <div class="data" id="output2"></div>
        </div>
    </div>
</body>
<footer>
    <a href="../../index.html"> Home </a>
</footer>

</html>
